name: Upstream Sync

permissions:
  contents: write

on:
  # 本仓库的 run.yml / README 相对上游深度定制（archs1/2/3、domains、ips 等分类清单），
  # 自动 merge 会把上游对这两处的改动直接带进来——其中无冲突标记的那些不会报错、
  # 只会静默覆盖（见 4e40f2b：push.branches 就这样被上游改成了 main）。
  # 因此取消定时同步，改为需要时手动触发，合并前先 review。
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v7

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          upstream_sync_repo: DustinWin/ruleset_geodata
          upstream_sync_branch: main
          target_sync_branch: master
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 由于上游仓库的 workflow 文件变更，导致 GitHub 自动暂停了本次自动更新，你需要手动 Sync Fork 一次。"
          exit 1
