name: Build ruleset and geodata
on:
  workflow_dispatch:
  # 数据仓库（domain-list-custom / geoip）构建成功后主动触发，避免 03:00 定时跑在
  # 数据之前 —— 它们的定时是 02:00 CST，一旦延迟或失败，本仓就会整轮取到旧数据且无信号。
  repository_dispatch:
    types: [data-updated]
  schedule:
    - cron: "0 3 * * *"
      timezone: "Asia/Shanghai"
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
      # 改 workflow 本身不该触发一次真实构建：Dependabot 每天扫 github-actions，
      # 每次依赖 bump 合并进 master 都会白跑一趟 68MB force push + 219 次 CDN purge。
      # config/** 不在忽略之列 —— 改 tag 清单本来就该重建。
      - ".github/**"

permissions:
  contents: write

# 三路触发（push / schedule / 手动）并发时会同时 force push 同一批分支，互相覆盖。
# 串行化，且不取消进行中的一轮（取消会留下 push 了一半的分支状态）。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set variables
        shell: bash
        run: |
          # 同一份源文档只拉一次，后面 4 个变量都从本地文件解析
          doc="${RUNNER_TEMP}/singbox-source-format.md"
          curl -fsSL --retry 3 --retry-delay 5 -o "${doc}" \
            https://raw.githubusercontent.com/reF1nd/sing-box/reF1nd-testing/docs/configuration/rule-set/source-format.md

          core_release=$(curl -fsSL --retry 3 --retry-delay 5 "https://api.github.com/repos/reF1nd/sing-box/tags?per_page=100" \
            | jq -r '.[].name' | grep -P '^v?[0-9]+\.[0-9]+\.[0-9]+-reF1nd.*' | head -n 1 | awk -F'[v.-]' '{print $2"."$3".0"}')
          core_latest=$(awk '/\*/ {last=$0} END {print last}' "${doc}" | sed -n 's/.*\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')
          core_compatible=$(awk '/\*/{lines[++count]=$0} END{print lines[count-1]}' "${doc}" | sed -n 's/.*\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')
          rules_latest=$(awk '/\*/ {last=$0} END {print last}' "${doc}" | sed -n 's/^* \([0-9]\+\):.*/\1/p')
          rules_compatible=$(awk '/\*/{lines[++count]=$0} END{print lines[count-1]}' "${doc}" | sed -n 's/^* \([0-9]\+\):.*/\1/p')

          # 解析为空会让下游把 "version": 生成成非法值并静默产出坏 srs，这里直接失败
          for pair in \
            "singbox_core_release_version=${core_release}" \
            "singbox_core_latest_version=${core_latest}" \
            "singbox_core_compatible_version=${core_compatible}" \
            "singbox_rules_latest_version=${rules_latest}" \
            "singbox_rules_compatible_version=${rules_compatible}"; do
            name="${pair%%=*}"; value="${pair#*=}"
            [ -n "${value}" ] || { echo "::error::${name} 解析为空，源文档格式可能已变"; exit 1; }
            echo "${name}=${value}" >> "${GITHUB_ENV}"
          done

          echo "update_version=$(date -d '+8 hours' +%Y-%m-%d)" >> "${GITHUB_ENV}"
          echo "domains_download_url=https://github.com/panyichen48737/domain-list-custom/releases/download/domains" >> "${GITHUB_ENV}"
          echo "ips_download_url=https://github.com/panyichen48737/geoip/releases/download/ips" >> "${GITHUB_ENV}"

      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Checkout `v2fly/domain-list-community`
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # 真正编译的是 ./community（声明 go 1.25.x），不是 ./custom
          go-version-file: ./community/go.mod
          cache-dependency-path: ./community/go.sum

      - name: Download source lists
        shell: bash
        run: |
          source ./config/tags.sh
          mkdir -p ./src/
          # 每个列表只下一次，geodata / mihomo / sing-box 三条链路都从 ./src 派生
          # （旧写法三条链路各下各的，同一样文件最多被请求 4 次）
          for domain in "${RULESET_DOMAINS[@]}"; do
            curl -fsSL --retry 3 --retry-delay 5 -o "./src/${domain}.list" "${domains_download_url}/${domain}.list"
          done
          for ip in "${RULESET_IPS[@]}"; do
            curl -fsSL --retry 3 --retry-delay 5 -o "./src/${ip}.list" "${ips_download_url}/${ip}.list"
          done
          if find ./src -type f -empty | grep -q .; then
            echo "::error::./src 下存在空文件"; find ./src -type f -empty; exit 1
          fi
          echo "已下载 $(find ./src -type f | wc -l) 个源列表"

      - name: Generate `mihomo` geodata
        shell: bash
        run: |
          source ./config/tags.sh
          export ARCH1="${GEODATA_ARCH1[*]}" ARCH2="${GEODATA_ARCH2[*]}" ARCH3="${GEODATA_ARCH3[*]}"

          # 源列表 -> 生成器格式：去 PROCESS-NAME，改写各类型前缀
          conv() { awk '!/^PROCESS-NAME,/' "$1" | sed -e 's/DOMAIN,/full:/' -e 's/DOMAIN-SUFFIX,//' -e 's/DOMAIN-KEYWORD,/keyword:/' -e 's/DOMAIN-REGEX,/regexp:/' > "$2"; }
          # fakeip-filter：剥离正则，补 keyword（full 版由调用方再把正则拼回）
          fakeip() { awk '!/^DOMAIN-REGEX,/' "$1" | sed -e 's/DOMAIN,/full:/' -e 's/DOMAIN-SUFFIX,//' > "$2"; printf 'keyword:ntp\nkeyword:stun\nkeyword:time\n' >> "$2"; }

          mkdir -p ./community/mydata/
          cd ./community/

          # datprofile：allowlist 任务；找不到 tag 会直接报错（旧写法会静默产出空 tag）
          python3 - <<'PY'
          import json, os
          a1, a2, a3 = (os.environ[n].split() for n in ("ARCH1", "ARCH2", "ARCH3"))
          fp = ["fakeip-filter"]
          json.dump([{"name": "geosite-all.dat", "mode": "allowlist", "lists": fp + a1},
                     {"name": "geosite.dat", "mode": "allowlist", "lists": fp + a2}],
                    open("profile-main.json", "w"))
          json.dump([{"name": "geosite-all-lite.dat", "mode": "allowlist", "lists": fp + a1},
                     {"name": "geosite-lite.dat", "mode": "allowlist", "lists": fp + a2}],
                    open("profile-lite.json", "w"))
          json.dump([{"name": "geosite-mini.dat", "mode": "allowlist",
                      "lists": ["cn" if t == "cn-lite" else t for t in a3]}],
                    open("profile-mini.json", "w"))
          PY

          # geosite-all.dat + geosite.dat
          for t in $(printf '%s\n' "${GEODATA_ARCH1[@]}" "${GEODATA_ARCH2[@]}" | sort -u); do
            conv "../src/${t}.list" "./mydata/${t}"
          done
          fakeip ../src/fakeip-filter.list ./mydata/fakeip-filter
          awk '/^DOMAIN-REGEX,/ && !/ntp|stun|time/' ../src/fakeip-filter.list | sed 's/DOMAIN-REGEX,/regexp:/' >> ./mydata/fakeip-filter
          go run ./ --datapath=./mydata/ --datprofile=./profile-main.json

          # geosite-all-lite.dat + geosite-lite.dat：tag 名不变，只换 fakeip-filter 的内容
          fakeip ../src/fakeip-filter-lite.list ./mydata/fakeip-filter
          go run ./ --datapath=./mydata/ --datprofile=./profile-lite.json

          # geosite-mini.dat：cn-lite 的内容以 cn 这个 tag 输出
          rm -f ./mydata/*
          for t in "${GEODATA_ARCH3[@]}"; do
            conv "../src/${t}.list" "./mydata/${t}"
          done
          mv -f ./mydata/cn-lite ./mydata/cn
          go run ./ --datapath=./mydata/ --datprofile=./profile-mini.json

      - name: Get geoip relative files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./mihomo-geodata/
          # 直接取 tags/mihomo-geodata 这一个 release，比扫 releases 列表更稳（不受分页影响），
          # 也只调一次 API；带 token 避免匿名 60/h 限流
          release=$(curl -fsSL --retry 3 --retry-delay 5 -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/panyichen48737/geoip/releases/tags/mihomo-geodata")
          urls=$(printf '%s' "${release}" | awk -F '"' '/"browser_download_url"/{print $4}')

          mapfile -t mihomo_mmdb < <(printf '%s\n' "${urls}" | grep '\.mmdb$')
          mapfile -t mihomo_others < <(printf '%s\n' "${urls}" | grep -v '\.mmdb$')

          [ ${#mihomo_mmdb[@]} -gt 0 ] || { echo "::error::geoip release 里没有 .mmdb"; exit 1; }
          [ ${#mihomo_others[@]} -gt 0 ] || { echo "::error::geoip release 里没有 .dat/.metadb"; exit 1; }

          for url in "${mihomo_mmdb[@]}"; do
            wget -q --tries=3 --retry-connrefused -P ./mihomo-geodata/ "${url}"
          done
          for url in "${mihomo_others[@]}"; do
            wget -q --tries=3 --retry-connrefused -P ./community/ "${url}"
          done

      - name: Move `mihomo` geodata files
        run: |
          cd ./community/ || exit 1
          for file in *.dat *.metadb; do
            install -Dp "./${file}" ../mihomo-geodata/
          done
          cd .. && rm -rf ./community

      - name: Prepare `mihomo` rule-set files
        shell: bash
        run: |
          source ./config/tags.sh
          mkdir -p ./mihomo-ruleset/

          for domain in "${RULESET_DOMAINS[@]}"; do
            mkdir -p "./tools/domains/${domain}/"
            # 只保留 DOMAIN / DOMAIN-SUFFIX：mihomo 的 behavior:domain 规则集（mrs/text）
            # 只能表达裸域名 / .suffix / 通配符，装不下 DOMAIN-KEYWORD 和 DOMAIN-REGEX。
            # 这两个类型在 geodata 和 sing-box 产物里是保留的，差异见 README。
            awk '/(DOMAIN,|DOMAIN-SUFFIX,)/' "./src/${domain}.list" | sed -e 's/DOMAIN,//' -e 's/DOMAIN-SUFFIX,/\+\./' >> "./tools/domains/${domain}/${domain}.list"
          done

          for ip in "${RULESET_IPS[@]}"; do
            mkdir -p "./tools/ips/${ip}/"
            sed 's/.*,//' "./src/${ip}.list" >> "./tools/ips/${ip}/${ip}.list"
          done

      - name: Prepare `sing-box` rule_set files
        shell: bash
        run: |
          source ./config/tags.sh

          # sing-box 侧走原始 .list，DOMAIN-KEYWORD / DOMAIN-REGEX / PROCESS-NAME 全保留
          for tag in "${RULESET_DOMAINS[@]}" "${RULESET_IPS[@]}"; do
            mkdir -p "./tools/rules/${tag}/"
            cp -f "./src/${tag}.list" "./tools/rules/${tag}/${tag}.list"
          done

      - name: Generate `mihomo` rule-set (mrs) and move .list files
        run: |
          curl -fsS --retry 3 --retry-delay 5 -o ./tools/mihomo -L https://github.com/DustinWin/proxy-tools/releases/download/mihomo/mihomo-meta-linux-amd64-v3.upx
          chmod +x ./tools/mihomo

          cd ./tools/
          chmod +x ./mihomo
          list=($(ls ./domains/))
          for ((i = 0; i < ${#list[@]}; i++)); do
            ./mihomo convert-ruleset domain text "./domains/${list[i]}/${list[i]}.list" ../mihomo-ruleset/${list[i]}.mrs
            mv -f "./domains/${list[i]}/${list[i]}.list" ../mihomo-ruleset/
          done

          list=($(ls ./ips/))
          for ((i = 0; i < ${#list[@]}; i++)); do
            ./mihomo convert-ruleset ipcidr text "./ips/${list[i]}/${list[i]}.list" ../mihomo-ruleset/${list[i]}.mrs
            mv -f "./ips/${list[i]}/${list[i]}.list" ../mihomo-ruleset/
          done
          rm -rf ./mihomo* ./domains/ ./ips/

      - name: Generate `sing-box` rule_set (srs) and move .json files
        shell: bash
        run: |
          echo "singbox_core_old_version=${singbox_core_compatible_version}" >> "${GITHUB_ENV}"
          echo "singbox_core_new_version=${singbox_core_latest_version}" >> "${GITHUB_ENV}"
          echo "singbox_ruleset_old_version=${singbox_rules_compatible_version}" >> "${GITHUB_ENV}"
          echo "singbox_ruleset_new_version=${singbox_rules_latest_version}" >> "${GITHUB_ENV}"

          if [[ "${singbox_core_latest_version}" == "${singbox_core_release_version}" ]]; then
            echo "singbox_equal=true" >> "${GITHUB_ENV}"
            compatible_bin="https://github.com/SagerNet/sing-box/releases/download/v${singbox_core_compatible_version}/sing-box-${singbox_core_compatible_version}-linux-amd64.tar.gz"
            latest_bin="https://github.com/DustinWin/proxy-tools/releases/download/sing-box/sing-box-ref1nd-stable-linux-amd64-v3.upx"
            compatible_is_tarball=true
          else
            echo "singbox_equal=false" >> "${GITHUB_ENV}"
            compatible_bin="https://github.com/DustinWin/proxy-tools/releases/download/sing-box/sing-box-ref1nd-stable-linux-amd64-v3.upx"
            latest_bin="https://github.com/DustinWin/proxy-tools/releases/download/sing-box/sing-box-ref1nd-testing-linux-amd64-v3.upx"
            compatible_is_tarball=false
          fi

          # convert.sh 是本仓库的脚本，Windows 上编辑容易丢掉可执行位（现在 git 里就是
          # 100644），显式补一次，别依赖 checkout 出来的权限位。
          chmod +x ./tools/convert.sh

          # Generate `sing-box` rule_set (compatible)
          mkdir -p ./sing-box-ruleset-compatible/
          if [ "${compatible_is_tarball}" = "true" ]; then
            curl -fsS --retry 3 --retry-delay 5 -L "${compatible_bin}" | tar -zx -C ./tools/
            mv -f "./tools/sing-box-${singbox_core_compatible_version}-linux-amd64/sing-box" ./tools/sing-box
          else
            curl -fsS --retry 3 --retry-delay 5 -o ./tools/sing-box -L "${compatible_bin}"
          fi
          chmod +x ./tools/sing-box
          # convert.sh 读 ./rules/、把产物写在 CWD，用子 shell 保持外层 cwd 在仓库根
          ( cd ./tools/ && ./convert.sh "${singbox_rules_compatible_version}" )
          mv -f ./tools/*.json ./tools/*.srs ./sing-box-ruleset-compatible/
          # tarball 路径会解出 sing-box-<ver>-linux-amd64/ 目录，`rm -f` 删不掉目录
          # （报 "Is a directory" 并让整步失败），必须用 -r
          rm -rf ./tools/sing-box*

          # Generate `sing-box` rule_set
          mkdir -p ./sing-box-ruleset/
          curl -fsS --retry 3 --retry-delay 5 -o ./tools/sing-box -L "${latest_bin}"
          chmod +x ./tools/sing-box
          ( cd ./tools/ && ./convert.sh "${singbox_rules_latest_version}" )
          mv -f ./tools/*.json ./tools/*.srs ./sing-box-ruleset/
          rm -rf ./tools/sing-box* ./tools/rules

      - name: Assert artifacts
        shell: bash
        run: |
          source ./config/tags.sh

          for f in geosite-all.dat geosite-all-lite.dat geosite.dat geosite-lite.dat geosite-mini.dat geoip.dat geoip.metadb Country.mmdb; do
            [ -s "./mihomo-geodata/${f}" ] || { echo "::error::./mihomo-geodata/${f} 缺失或为空"; exit 1; }
          done

          expected=$(( (${#RULESET_DOMAINS[@]} + ${#RULESET_IPS[@]}) * 2 ))
          for dir in ./mihomo-ruleset ./sing-box-ruleset ./sing-box-ruleset-compatible; do
            actual=$(find "${dir}" -maxdepth 1 -type f | wc -l)
            [ "${actual}" -eq "${expected}" ] || { echo "::error::${dir} 期望 ${expected} 个文件，实际 ${actual}"; exit 1; }
            if find "${dir}" -maxdepth 1 -type f -empty | grep -q .; then
              echo "::error::${dir} 存在空文件"; exit 1
            fi
          done
          echo "产物校验通过"

      - name: Push `mihomo-geodata` branch
        id: push_geodata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source ./.github/scripts/push-branch.sh
          push_branch mihomo-geodata ./mihomo-geodata "mihomo 内核 geodata 文件更新于 ${update_version}"

      - name: Release and upload `mihomo-geodata` assets
        if: steps.push_geodata.outputs.changed == 'true'
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: mihomo-geodata
          tag: mihomo-geodata
          overwrite: true
          body: |
            [mihomo 内核](https://github.com/MetaCubeX/mihomo) geodata 文件
            geodata 文件更新于 ${{ env.update_version }}
          file_glob: true
          file: ./mihomo-geodata/*

      - name: Purge jsDelivr CDN (mihomo-geodata)
        if: steps.push_geodata.outputs.changed == 'true'
        run: |
          cd ./mihomo-geodata/ || exit 1
          for file in *; do
            resp=$(curl -fsS --retry 3 --retry-delay 5 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@mihomo-geodata/${file}" || true)
            status=$(printf '%s' "${resp}" | jq -r '.status // empty' 2>/dev/null || true)
            # 只看顶层 status：响应里的 throttled 是 per-path「最近已作废过」，不代表这次失败
            [ -n "${status}" ] || echo "::warning::mihomo-geodata/${file} purge 未拿到有效响应: ${resp}"
          done

      - name: Push `mihomo-ruleset` branch
        id: push_ruleset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source ./.github/scripts/push-branch.sh
          push_branch mihomo-ruleset ./mihomo-ruleset "mihomo 内核 rule-set 规则集文件更新于 ${update_version}"

      - name: Release and upload `mihomo-ruleset` assets
        if: steps.push_ruleset.outputs.changed == 'true'
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: mihomo-ruleset
          tag: mihomo-ruleset
          overwrite: true
          body: |
            [mihomo 内核](https://github.com/MetaCubeX/mihomo) rule-set 规则集文件
            规则集文件更新于 ${{ env.update_version }}
          file_glob: true
          file: ./mihomo-ruleset/*

      - name: Purge jsDelivr CDN (mihomo-ruleset)
        if: steps.push_ruleset.outputs.changed == 'true'
        run: |
          cd ./mihomo-ruleset/ || exit 1
          for file in *; do
            resp=$(curl -fsS --retry 3 --retry-delay 5 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@mihomo-ruleset/${file}" || true)
            status=$(printf '%s' "${resp}" | jq -r '.status // empty' 2>/dev/null || true)
            # 只看顶层 status：响应里的 throttled 是 per-path「最近已作废过」，不代表这次失败
            [ -n "${status}" ] || echo "::warning::mihomo-ruleset/${file} purge 未拿到有效响应: ${resp}"
          done

      - name: Push `sing-box-ruleset-compatible` branch
        id: push_sb_compatible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source ./.github/scripts/push-branch.sh
          push_branch sing-box-ruleset-compatible ./sing-box-ruleset-compatible "sing-box 内核 rule_set 规则集文件更新于 ${update_version}"

      - name: Release and upload `sing-box-ruleset-compatible` assets
        if: steps.push_sb_compatible.outputs.changed == 'true'
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: sing-box-ruleset-compatible
          tag: sing-box-ruleset-compatible
          overwrite: true
          body: |
            [sing-box 内核](https://github.com/SagerNet/sing-box) rule_set 规则集文件
            适用于 v${{ env.singbox_core_old_version }}-v${{ env.singbox_core_new_version }}（不包含）系列版本的 sing-box 内核（`"version": ${{ env.singbox_ruleset_old_version }}`）
            规则集文件更新于 ${{ env.update_version }}
          file_glob: true
          file: ./sing-box-ruleset-compatible/*

      - name: Purge jsDelivr CDN (sing-box-ruleset-compatible)
        if: steps.push_sb_compatible.outputs.changed == 'true'
        run: |
          cd ./sing-box-ruleset-compatible/ || exit 1
          for file in *; do
            resp=$(curl -fsS --retry 3 --retry-delay 5 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@sing-box-ruleset-compatible/${file}" || true)
            status=$(printf '%s' "${resp}" | jq -r '.status // empty' 2>/dev/null || true)
            # 只看顶层 status：响应里的 throttled 是 per-path「最近已作废过」，不代表这次失败
            [ -n "${status}" ] || echo "::warning::sing-box-ruleset-compatible/${file} purge 未拿到有效响应: ${resp}"
          done

      - name: Push `sing-box-ruleset` branch
        id: push_sb_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source ./.github/scripts/push-branch.sh
          push_branch sing-box-ruleset ./sing-box-ruleset "sing-box 内核 rule_set 规则集文件更新于 ${update_version}"

      - name: Release and upload `sing-box-ruleset` assets (singbox_equal == true)
        if: steps.push_sb_latest.outputs.changed == 'true' && env.singbox_equal == 'true'
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: sing-box-ruleset
          tag: sing-box-ruleset
          overwrite: true
          body: |
            [sing-box 内核](https://github.com/SagerNet/sing-box) rule_set 规则集文件
            适用于 v${{ env.singbox_core_new_version }}（包含）+ 系列版本的 sing-box 内核（`"version": ${{ env.singbox_ruleset_new_version }}`）
            规则集文件更新于 ${{ env.update_version }}
          file_glob: true
          file: ./sing-box-ruleset/*

      - name: Release and upload `sing-box-ruleset` assets (singbox_equal == false)
        if: steps.push_sb_latest.outputs.changed == 'true' && env.singbox_equal == 'false'
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: sing-box-ruleset
          tag: sing-box-ruleset
          overwrite: true
          body: |
            [sing-box 内核](https://github.com/SagerNet/sing-box) rule_set 规则集文件
            适用于 v${{ env.singbox_core_new_version }} 系列版本的 sing-box 内核（`"version": ${{ env.singbox_ruleset_new_version }}`）
            规则集文件更新于 ${{ env.update_version }}
          file_glob: true
          file: ./sing-box-ruleset/*

      - name: Purge jsDelivr CDN (sing-box-ruleset)
        if: steps.push_sb_latest.outputs.changed == 'true'
        run: |
          cd ./sing-box-ruleset/ || exit 1
          for file in *; do
            resp=$(curl -fsS --retry 3 --retry-delay 5 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@sing-box-ruleset/${file}" || true)
            status=$(printf '%s' "${resp}" | jq -r '.status // empty' 2>/dev/null || true)
            # 只看顶层 status：响应里的 throttled 是 per-path「最近已作废过」，不代表这次失败
            [ -n "${status}" ] || echo "::warning::sing-box-ruleset/${file} purge 未拿到有效响应: ${resp}"
          done

      # 只在上一步都成功时运行：此时本地文件集是完整的，删掉的必然是真残留。
      - name: Prune stale release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source ./.github/scripts/prune-release.sh
          prune_release mihomo-geodata ./mihomo-geodata
          prune_release mihomo-ruleset ./mihomo-ruleset
          prune_release sing-box-ruleset-compatible ./sing-box-ruleset-compatible
          prune_release sing-box-ruleset ./sing-box-ruleset

  # 单独一个 job：删除运行记录只需要 actions:write，不该让整个 build job 都带着这个权限
  cleanup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 1
